name: Dojo de Bolso 2.0 - CI

on:
  push:
    branches:
      - feat/dojo-2.0-foundation
    paths:
      - "v2/**"
      - ".github/workflows/dojo-v2-ci.yml"
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/dojo-v2-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Type-check and production build
        run: npm run build
