<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dojô de Bolso | Kit do Exame para Imprimir</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="icon" href="../assets/icon.svg">
<style>
  body { background: #E9EBF0; }
  .barra-f { position: sticky; top: 0; z-index: 3; background: var(--ai); color: #fff; }
  .barra-f .wrap { max-width: 860px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; min-height: 60px; padding-top: 8px; padding-bottom: 8px; }
  .barra-f h1 { font-size: 18px; flex: 1; min-width: 160px; }
  .barra-f select, .barra-f input { font: inherit; padding: 8px 10px; border-radius: 10px; border: 0; }
  .barra-f input { width: 170px; }
  .barra-f .btn { width: auto; min-height: 42px; font-size: 15px; padding: 8px 16px; }
  .barra-f a { color: #fff; font-size: 14px; }
  .partes { max-width: 860px; margin: 12px auto 0; padding: 0 16px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; }
  .partes label { display: flex; gap: 6px; align-items: center; }
  .folhas { max-width: 860px; margin: 14px auto 40px; padding: 0 16px; display: grid; gap: 18px; }
  .folha { background: #fff; border-radius: 12px; padding: 28px 30px; box-shadow: 0 10px 30px -20px rgba(30,38,71,.5); }
  .cab { display: flex; justify-content: space-between; gap: 16px; align-items: end; border-bottom: 6px solid var(--fc); padding-bottom: 10px; margin-bottom: 16px; }
  .cab h2 { color: var(--ai); font-size: 30px; line-height: 1.1; }
  .cab p { font-size: 14px; color: var(--cinza); }
  .cab .obi-f { display: inline-block; width: 70px; height: 14px; border-radius: 3px; background: var(--fc); box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
  h3 { color: var(--ai); font-size: 18px; margin: 16px 0 8px; }
  .tab { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tab th, .tab td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--linha); vertical-align: top; }
  .tab th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--cinza); }
  .tab td:first-child { font-weight: 700; color: var(--ai); white-space: nowrap; }
  .qa { display: grid; gap: 8px; font-size: 14px; }
  .qa div { break-inside: avoid; }
  .qa b { color: var(--ai); }
  .qa span { display: block; color: #333; }
  .glos { columns: 3; column-gap: 18px; font-size: 13.5px; }
  .glos div { break-inside: avoid; padding: 3px 0; border-bottom: 1px dotted var(--linha); }
  .glos b { color: var(--ai); }
  .cartoes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-top: 1.5px dashed #999; border-left: 1.5px dashed #999; }
  .cartao { border-right: 1.5px dashed #999; border-bottom: 1.5px dashed #999; display: grid; grid-template-rows: 1fr 1fr; min-height: 120px; break-inside: avoid; }
  .cartao > div { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 8px; }
  .cartao .frente { border-bottom: 1px dotted #bbb; font-weight: 800; color: var(--ai); font-size: 17px; }
  .cartao .verso { font-size: 13.5px; transform: rotate(180deg); }
  .cartao small { display: block; font-size: 11px; color: var(--cinza); font-weight: 500; margin-top: 3px; }
  .dica { font-size: 13px; color: var(--cinza); margin-bottom: 10px; }
  .cal { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .dia { border: 1.5px solid var(--linha); border-radius: 8px; padding: 8px; font-size: 12.5px; line-height: 1.35; min-height: 92px; position: relative; break-inside: avoid; }
  .dia b { display: block; font-size: 12px; color: var(--cinza); }
  .dia.esp { border-color: var(--fc); background: #FAFAF6; }
  .dia::after { content: ''; position: absolute; right: 7px; top: 7px; width: 14px; height: 14px; border: 1.5px solid var(--sumi); border-radius: 3px; }
  .lista { list-style: none; display: grid; gap: 9px; font-size: 15px; }
  .lista li { display: flex; gap: 10px; }
  .lista li::before { content: ''; flex: none; width: 16px; height: 16px; border: 1.5px solid var(--sumi); border-radius: 3px; margin-top: 3px; }
  .cert { text-align: center; border: 8px double var(--fc); border-radius: 6px; padding: 40px 30px; }
  .cert .selo { font-size: 13px; letter-spacing: .25em; text-transform: uppercase; color: var(--cinza); }
  .cert h2 { font-family: 'Dela Gothic One', sans-serif; font-weight: 400; color: var(--ai); font-size: 38px; margin: 12px 0; }
  .cert .nome { font-size: 30px; font-weight: 900; border-bottom: 2px solid var(--sumi); display: inline-block; min-width: 60%; padding: 6px 12px; margin: 14px 0; min-height: 50px; }
  .cert p { font-size: 16px; max-width: 520px; margin: 0 auto; }
  .cert .assin { display: flex; justify-content: space-around; gap: 20px; margin-top: 46px; font-size: 13px; }
  .cert .assin span { border-top: 1.5px solid var(--sumi); padding-top: 6px; min-width: 180px; }
  .rodape-f { margin-top: 14px; font-size: 12px; color: var(--cinza); text-align: right; }
  .bloqueio { max-width: 520px; margin: 60px auto; background: #fff; border-radius: 16px; padding: 24px; text-align: center; }
  .bloqueio h2 { color: var(--ai); margin-bottom: 10px; }
  @media (max-width: 640px) { .folha { padding: 20px 16px; } .cartoes { grid-template-columns: repeat(2, 1fr); } .cal { grid-template-columns: repeat(2, 1fr); } .glos { columns: 2; } }
  @media print {
    @page { size: A4; margin: 12mm; }
    body { background: #fff; }
    .barra-f, .partes { display: none; }
    .folhas { margin: 0; padding: 0; max-width: none; gap: 0; }
    .folha { box-shadow: none; border-radius: 0; padding: 0; page-break-after: always; break-after: page; }
    .cartoes { grid-template-columns: repeat(3, 1fr) !important; }
    .cal { grid-template-columns: repeat(5, 1fr) !important; }
    .glos { columns: 3 !important; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="barra-f">
  <div class="wrap">
    <h1>Kit do Exame para Imprimir</h1>
    <label><span style="position:absolute;width:1px;height:1px;overflow:hidden">Faixa</span><select id="faixa"></select></label>
    <label><span style="position:absolute;width:1px;height:1px;overflow:hidden">Nome no certificado</span><input id="nome" placeholder="Nome do judoca" maxlength="40"></label>
    <button class="btn" id="imprimir">Imprimir ou salvar PDF</button>
    <a href="../app/">Voltar ao app</a>
  </div>
</div>
<div class="partes" id="partes"></div>
<main class="folhas" id="folhas"></main>
<script src="../assets/js/data.js"></script>
<script>
(function () {
  try { if (new URLSearchParams(location.search).get('kit') === '1') localStorage.setItem('dojo_kit', 'true'); } catch (e) {}
  const get = (k, d) => { try { const v = localStorage.getItem('dojo_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
  const liberado = get('kit', false) || get('plano', '') === 'anual';
  if (!liberado) {
    document.querySelector('.barra-f').hidden = true;
    document.getElementById('folhas').outerHTML = `<div class="bloqueio"><h2>Kit do Exame para Imprimir</h2><p>O kit faz parte do adicional "Kit do Exame para Imprimir" e do plano Anual. Se você comprou, abra o app pelo link do e-mail de acesso para liberar.</p><p style="margin-top:14px"><a class="btn dark" href="../app/">Voltar ao app</a></p></div>`;
    return;
  }
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const sel = document.getElementById('faixa'), inpNome = document.getElementById('nome');
  const perfilId = get('perfilAtual', 'p1');
  const perfil = (get('perfis', []) || []).find(p => p.id === perfilId);
  const faixaIni = get(`p_${perfilId}_faixa`, 'azul');
  sel.innerHTML = FAIXAS.map(f => `<option value="${f.id}" ${f.id === faixaIni ? 'selected' : ''}>Faixa ${f.nome}</option>`).join('');
  if (perfil && perfil.nome && !/^Judoca \d$/.test(perfil.nome)) inpNome.value = perfil.nome;

  const PARTES = [['cartilha', 'Cartilha da faixa'], ['cartoes', 'Cartões de memorizar'], ['calendario', 'Calendário de 30 dias'], ['checklist', 'Checklist da véspera'], ['certificado', 'Certificado']];
  const on = Object.fromEntries(PARTES.map(([k]) => [k, true]));
  document.getElementById('partes').innerHTML = 'Imprimir: ' + PARTES.map(([k, n]) => `<label><input type="checkbox" data-p="${k}" checked> ${n}</label>`).join('');
  document.querySelectorAll('[data-p]').forEach(c => c.onchange = () => { on[c.dataset.p] = c.checked; montar(); });

  const cab = (f, tit, sub) => `<header class="cab"><div><h2>${tit}</h2><p>${sub}</p></div><div style="text-align:right"><span class="obi-f"></span><p>Faixa ${f.nome.toLowerCase()} · ${f.kyu}</p></div></header>`;
  const rod = '<p class="rodape-f">Dojô de Bolso · material de estudo independente</p>';

  function cartilha(f) {
    const lista = tecnicasDa(f.id), antes = tecnicasAte(f.id).length - lista.length;
    const temas = [...new Set(TEORIA.map(t => t.t))];
    return `<article class="folha" style="--fc:${f.cor}">${cab(f, 'Cartilha da faixa ' + f.nome.toLowerCase(), 'Os golpes, a teoria e as palavras que a banca costuma cobrar')}
      <h3>Golpes da faixa ${f.nome.toLowerCase()} (${lista.length})</h3>
      <table class="tab"><thead><tr><th>Golpe</th><th>Tradução</th><th>Grupo</th></tr></thead><tbody>
      ${lista.map(t => `<tr><td>${esc(t.n)}</td><td>${esc(t.tr)}</td><td>${GRUPOS[t.g].nome} · ${GRUPOS[t.g].desc}</td></tr>`).join('')}</tbody></table>
      ${antes ? `<p class="dica" style="margin-top:8px">A banca também pode pedir os ${antes} golpes das faixas anteriores. Revise pelo app, em Revisão.</p>` : ''}
      <h3>Teoria que cai no exame</h3>
      ${temas.map(tm => `<p style="font-weight:800;margin:10px 0 4px">${esc(tm)}</p><div class="qa">${TEORIA.filter(t => t.t === tm).map(t => `<div><b>${esc(t.q)}</b><span>${esc(t.o[t.c])}. ${esc(t.x)}</span></div>`).join('')}</div>`).join('')}
      <h3>Glossário</h3>
      <div class="glos">${GLOSSARIO.map(([p, s]) => `<div><b>${esc(p)}</b>: ${esc(s)}</div>`).join('')}</div>
      ${rod}</article>`;
  }

  function cartoes(f) {
    const golpes = tecnicasAte(f.id).map(t => [t.n, t.tr, 'Faixa ' + FAIXAS.find(x => x.id === t.f).nome.toLowerCase()]);
    const termos = GLOSSARIO.filter(([p]) => !/^(Ichi|Ni|San|Shi|Go|Roku|Shichi|Hachi|Ku|Ju)$/.test(p)).map(([p, s]) => [p, s, 'Termo']);
    const todos = [...golpes, ...termos];
    const porFolha = 18, folhas = [];
    for (let i = 0; i < todos.length; i += porFolha) folhas.push(todos.slice(i, i + porFolha));
    return folhas.map((grupo, i) => `<article class="folha" style="--fc:${f.cor}">${cab(f, 'Cartões de memorizar' + (folhas.length > 1 ? ` (${i + 1} de ${folhas.length})` : ''), 'Recorte na linha tracejada e dobre na pontilhada')}
      ${i === 0 ? '<p class="dica">Como usar: leia o nome em voz alta, diga o que ele é e vire o cartão para conferir. Os que errar voltam para o monte.</p>' : ''}
      <div class="cartoes">${grupo.map(([n, s, tag]) => `<div class="cartao"><div class="frente">${esc(n)}<small>${esc(tag)}</small></div><div class="verso">${esc(s)}</div></div>`).join('')}</div>
      ${rod}</article>`).join('');
  }

  function calendario(f) {
    const lista = tecnicasDa(f.id);
    const temas = [...new Set(TEORIA.map(t => t.t))];
    let ti = 0, te = 0;
    const dias = [];
    for (let d = 1; d <= 30; d++) {
      let txt, esp = false;
      if (d === 30) { txt = 'Véspera: confira o checklist, revise só os cartões e durma cedo.'; esp = true; }
      else if (d === 29) { txt = 'Modo banca completo no app, como se fosse o exame.'; esp = true; }
      else if (d % 7 === 0) { txt = 'Simulado no app. Anote os erros e refaça as aulas deles.'; esp = true; }
      else {
        const t = lista[ti++ % lista.length];
        txt = `Aula: <b style="display:inline;color:var(--ai)">${esc(t.n)}</b>. 10 entradas de cada lado.`;
        if (d % 3 === 0) txt += ` Teoria: ${esc(temas[te++ % temas.length]).toLowerCase()}.`;
        else txt += ' 5 cartões.';
      }
      dias.push(`<div class="dia ${esp ? 'esp' : ''}"><b>Dia ${d}</b>${txt}</div>`);
    }
    return `<article class="folha" style="--fc:${f.cor}">${cab(f, 'Calendário de 30 dias', 'Um pouco por dia até o exame. Marque o quadrado quando fizer.')}
      <div class="cal">${dias.join('')}</div>
      <p class="dica" style="margin-top:12px">Faltam menos de 30 dias? Comece pelo dia que corresponde ao tempo que falta e junte dois dias quando der.</p>
      ${rod}</article>`;
  }

  function checklist(f) {
    const itens = [
      'Judogi limpo e passado, sem rasgos. Leve um de reserva se tiver.',
      'Faixa atual amarrada do jeito certo (treine o nó antes).',
      'Unhas das mãos e dos pés cortadas.',
      'Cabelo comprido preso com elástico sem metal.',
      'Sem relógio, brinco, colar ou anel.',
      'Chinelo para andar fora do tatame.',
      'Garrafa de água e um lanche leve.',
      'Documento, carteirinha da federação e comprovante da taxa do exame, se pedirem.',
      `Revisei os nomes dos ${tecnicasAte(f.id).length} golpes com os cartões.`,
      'Sei o que significam rei, hajime, matte, sore-made, tori e uke.',
      'Fiz o modo banca do app pelo menos uma vez nesta semana.',
      'Na hora: cumprimente ao entrar e sair do tatame, ouça o nome do golpe até o fim e faça com calma, para os dois lados se pedirem.',
      'Esqueceu um nome? Respire e peça para a banca repetir. É permitido e acontece com todo mundo.',
    ];
    return `<article class="folha" style="--fc:${f.cor}">${cab(f, 'Checklist da véspera', 'Confira na noite anterior e de novo antes de sair de casa')}
      <ul class="lista">${itens.map(i => `<li>${esc(i)}</li>`).join('')}</ul>
      <p class="dica" style="margin-top:16px">Cada federação e academia pode pedir algo a mais. Confirme com o seu professor.</p>
      ${rod}</article>`;
  }

  function certificado(f) {
    return `<article class="folha" style="--fc:${f.cor}"><div class="cert">
      <p class="selo">Dojô de Bolso</p>
      <h2>Pronto para o exame</h2>
      <p>Certificamos que</p>
      <div class="nome">${esc(inpNome.value.trim())}</div>
      <p>estudou os golpes, a teoria e os termos da <b>faixa ${f.nome.toLowerCase()}</b> e está pronto para mostrar na banca o que aprendeu no tatame.</p>
      <div class="assin"><span>Data</span><span>Assinatura do professor ou responsável</span></div>
    </div><p class="rodape-f">Certificado de estudo, não substitui a graduação oficial.</p></article>`;
  }

  function montar() {
    const f = FAIXAS.find(x => x.id === sel.value) || FAIXAS[0];
    const fns = { cartilha, cartoes, calendario, checklist, certificado };
    document.getElementById('folhas').innerHTML = PARTES.filter(([k]) => on[k]).map(([k]) => fns[k](f)).join('');
  }
  sel.onchange = montar;
  inpNome.oninput = () => { const n = document.querySelector('.cert .nome'); if (n) n.textContent = inpNome.value.trim(); };
  document.getElementById('imprimir').onclick = () => window.print();
  montar();
})();
</script>
</body>
</html>
